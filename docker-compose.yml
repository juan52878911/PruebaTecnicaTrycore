services:
  postgres:
    image: postgres:16-alpine
    container_name: evm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: evm
      POSTGRES_USER: evm
      POSTGRES_PASSWORD: evm
    volumes:
      - evm-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evm -d evm"]
      interval: 5s
      retries: 10

volumes:
  evm-postgres-data:
