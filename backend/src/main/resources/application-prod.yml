# Perfil prod: la configuración sensible viene solo de variables de entorno, sin valores por defecto.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    # La base local de docker-compose se comparte entre los perfiles dev y prod. Si dev corrió
    # antes, el historial de Flyway contiene la migración repetible de seed (db/seed/dev), que este
    # perfil no incluye a propósito. Sin esta opción Flyway rechaza arrancar por "migración aplicada
    # no resuelta localmente". El patrón se limita a las repetibles: una migración VERSIONADA que
    # falte sí debe seguir rompiendo el arranque, porque significa que la base tiene aplicado algo
    # que este build no conoce.
    ignore-migration-patterns: 'repeatable:missing'

springdoc:
  api-docs:
    enabled: ${EVM_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${EVM_SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO

evm:
  cors:
    # Sin valor por defecto a propósito: un despliegue que no declare el origen del frontend no abre
    # el API a nadie. Se pasa como lista separada por comas.
    allowed-origins: ${EVM_CORS_ALLOWED_ORIGINS:}
