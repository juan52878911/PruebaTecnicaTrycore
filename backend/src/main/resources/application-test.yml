# Perfil test: sin datasource fijo. Testcontainers inyecta la conexión en tiempo de ejecución
# mediante @ServiceConnection o DynamicPropertySource según el test.
spring:
  flyway:
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

evm:
  cors:
    # Origen fijo de prueba: el test de contrato comprueba que este pasa y que cualquier otro no.
    allowed-origins: http://localhost:4200
