# Perfil dev: apunta al PostgreSQL local levantado con docker-compose en la raíz del repo.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/evm
    username: evm
    password: evm
  flyway:
    locations: classpath:db/migration,classpath:db/seed/dev
    # Solo en dev: alguien puede haber creado la base a mano con db/init.sql, que deja el esquema
    # sin tabla de historial. Con esto Flyway lo toma como punto de partida en lugar de fallar por
    # "esquema no vacío". En prod NO se activa a propósito: allí un esquema preexistente y
    # desconocido debe romper el arranque en vez de aceptarse en silencio.
    baseline-on-migrate: true
    baseline-version: '0'
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

evm:
  cors:
    # Orígenes del frontend en local: ng serve (4200) y el build de producción servido aparte (4300).
    allowed-origins: http://localhost:4200,http://localhost:4300
