# Perfil dev: apunta al PostgreSQL local levantado con docker-compose en la raiz del repo.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/evm
    username: evm
    password: evm
  flyway:
    locations: classpath:db/migration,classpath:db/seed/dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
